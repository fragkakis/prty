name: Release

# Pushing a v* tag builds a universal PRty-Time.zip and publishes it as a GitHub release.
# Running it by hand (Actions → Release → Run workflow) only builds, as a test.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      # Full history and tags, for the commit list in the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            make zip VERSION="${GITHUB_REF_NAME#v}"
          else
            make zip
          fi
          lipo -archs ".build/PRty Time.app/Contents/MacOS/PRtyTime"

      # archive: false uploads the zip as-is instead of zipping it again.
      - uses: actions/upload-artifact@v7
        with:
          path: .build/PRty-Time.zip
          archive: false

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases created on github.com already exist: just attach the zip and keep their notes.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .build/PRty-Time.zip --clobber
          else
            { Scripts/release-changes.sh "$GITHUB_REF_NAME"; echo; cat .github/release-notes.md; } > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" .build/PRty-Time.zip --title "PRty Time $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # TAP_DEPLOY_KEY: private half of a deploy key with write access to fragkakis/homebrew-tap.
      - uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repository: fragkakis/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 .build/PRty-Time.zip | cut -d' ' -f1)
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/prty-time.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "prty-time $version"
          git push
