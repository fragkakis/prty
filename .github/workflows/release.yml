name: Release

# Pushing a v* tag builds a universal PRty-Time.zip and publishes it as a GitHub release.
# Running it by hand (Actions → Release → Run workflow) only builds, as a test.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            make zip VERSION="${GITHUB_REF_NAME#v}"
          else
            make zip
          fi
          lipo -archs ".build/PRty Time.app/Contents/MacOS/PRtyTime"

      - uses: actions/upload-artifact@v4
        with:
          name: PRty-Time
          path: .build/PRty-Time.zip

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases created on github.com already exist: just attach the zip.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .build/PRty-Time.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" .build/PRty-Time.zip --title "PRty Time $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
          fi

      # TAP_DEPLOY_KEY: private half of a deploy key with write access to fragkakis/homebrew-tap.
      - uses: actions/checkout@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repository: fragkakis/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 .build/PRty-Time.zip | cut -d' ' -f1)
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/prty-time.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "prty-time $version"
          git push
